<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q-Link - Garson</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">
  <header class="bg-green-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 sm:py-4 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div>
          <h1 class="text-xl sm:text-2xl md:text-3xl font-bold">Garson</h1>
          <p class="text-green-100 text-xs sm:text-sm">Servis ve teslim</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="waiterIdentityBadge" class="hidden bg-green-500/80 px-3 py-2 rounded-xl text-xs font-semibold"></span>
        <button id="btnWaiterLogout" type="button" onclick="logoutWaiter()" class="hidden bg-white/15 hover:bg-white/25 px-3 py-2.5 min-h-[44px] rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-white/50">Çıkış</button>
        <button type="button" onclick="renderWaiter()" class="bg-green-500 hover:bg-green-400 px-4 py-2.5 min-h-[44px] rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-white/50">Yenile</button>
      </div>
    </div>
  </header>

  <section class="max-w-7xl mx-auto px-4 py-6">
    <div class="bg-white rounded-2xl shadow-md p-6">
      <h2 class="text-2xl md:text-3xl font-bold">Garson Paneli</h2>
      <p class="text-gray-500 mt-2">Sadece servise hazır siparişler burada listelenir.</p>
    </div>
  </section>

  <main class="max-w-7xl mx-auto px-4 pb-10">
    <div id="waiterGrid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
  </main>

  <div id="waiterAuthOverlay" class="fixed inset-0 z-[70] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-gray-100 p-6">
      <p class="text-xs uppercase tracking-wide text-green-700 font-semibold">Güvenli Giriş</p>
      <h3 class="text-2xl font-bold mt-1">Garson Paneli</h3>
      <p class="text-sm text-gray-500 mt-2">Garson adınızı yazıp PIN ile giriş yapın.</p>
      <div class="mt-4 space-y-3">
        <input id="waiterNameInput" type="text" placeholder="Garson adı" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500">
        <input id="waiterPasswordInput" type="password" placeholder="Garson PIN" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500">
        <p id="waiterAuthError" class="text-sm text-red-600 min-h-[1.25rem]"></p>
      </div>
      <div class="mt-3 grid grid-cols-2 gap-2">
        <button type="button" onclick="window.location.href='/'" class="w-full bg-white hover:bg-gray-100 text-gray-800 border border-gray-200 py-3 rounded-xl font-semibold">Vazgeç</button>
        <button type="button" onclick="submitWaiterPassword()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-semibold">Giriş Yap</button>
      </div>
    </div>
  </div>

  <!-- Garson çağırma bildirimi -->
  <div id="waiterCallOverlay" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>
    <div class="relative w-full max-w-md bg-white rounded-3xl shadow-xl border border-gray-100 p-6">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-start gap-3">
          <div class="mt-0.5 w-10 h-10 rounded-2xl bg-green-100 text-green-700 flex items-center justify-center font-bold">!</div>
          <div>
            <p class="text-sm font-semibold text-gray-500">Garson çağrısı</p>
            <h3 id="waiterCallTitle" class="text-2xl font-extrabold text-gray-900">Masa — garson çağırdı</h3>
            <p id="waiterCallTime" class="mt-1 text-sm text-gray-500"></p>
          </div>
        </div>
        <button type="button" onclick="hideWaiterCallOverlay()" class="shrink-0 rounded-xl px-3 py-2 text-sm font-semibold bg-gray-100 hover:bg-gray-200 text-gray-700 focus:outline-none focus:ring-2 focus:ring-green-400">Kapat</button>
      </div>
      <div class="mt-5 flex justify-end gap-2">
        <button type="button" onclick="acknowledgeWaiterCall()" class="bg-green-600 hover:bg-green-700 active:bg-green-800 text-white px-5 py-3 rounded-xl font-semibold focus:outline-none focus:ring-2 focus:ring-green-300">İlgileniyorum</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
  <script>
    let waiterPageStarted = false;
    let activeWaiterCall = null;

    function getLoggedInWaiter() {
      const user = getLoggedInUser();
      if (!user || user.role !== 'waiter') return null;
      return user;
    }

    function syncWaiterIdentityUi() {
      const waiter = getLoggedInWaiter();
      const badge = document.getElementById('waiterIdentityBadge');
      const logoutBtn = document.getElementById('btnWaiterLogout');
      if (!badge || !logoutBtn) return;
      if (waiter) {
        badge.textContent = `Garson: ${waiter.name || `#${waiter.id}`}`;
        badge.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
        logoutBtn.classList.add('hidden');
      }
    }

    function logoutWaiter() {
      logoutUser();
      window.location.reload();
    }

    async function renderWaiter() {
      const grid = document.getElementById('waiterGrid');
      try {
        const orders = (await getOrders()).filter(order => order.status === 'hazir');
        grid.innerHTML = orders.length ? orders.map(order => `
          <div class="bg-white rounded-2xl shadow-md p-5">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-xl font-bold">Sipariş #${escapeHtml(getOrderDisplayNo(order))}</h3>
              <span class="px-3 py-1 rounded-full text-sm font-semibold ${statusBadge(order.status)}">${escapeHtml(statusLabel(order.status))}</span>
            </div>
            <div class="space-y-2 mb-4">
              <p class="text-sm text-gray-500">Masa: ${escapeHtml(order.tableNo)}</p>
              <p class="text-sm text-gray-500">Saat: ${escapeHtml(order.createdAt)}</p>
            </div>
            <div class="space-y-2 mb-5">
              ${order.items.map(item => `<div class="bg-gray-50 rounded-xl p-3 flex justify-between"><span>${escapeHtml(item.quantity)} x ${escapeHtml(item.name)}</span><span>${escapeHtml(item.price * item.quantity)}₺</span></div>`).join('')}
            </div>
            <button type="button" onclick="deliverOrder(${order.id})" class="w-full bg-green-600 hover:bg-green-700 active:bg-green-800 text-white py-3.5 min-h-[48px] rounded-xl font-semibold focus:outline-none focus:ring-2 focus:ring-green-300">Servis Edildi</button>
          </div>`).join('')
          : '<div class="bg-white rounded-2xl shadow-md p-6 text-gray-500">Servise hazır sipariş yok.</div>';
      } catch (e) {
        grid.innerHTML = '<div class="bg-white rounded-2xl shadow-md p-6 text-red-500">Siparişler yüklenemedi.</div>';
      }
    }

    async function deliverOrder(orderId) {
      const waiter = getLoggedInWaiter();
      if (!waiter) {
        alert('Teslim için garson girişi gerekli.');
        return;
      }
      try {
        await updateOrderStatus(orderId, 'teslim');
        await renderWaiter();
      } catch (e) {
        alert(e.message || 'Hata oluştu.');
      }
    }

    function showWaiterCallOverlay(tableNo, ts) {
      const overlay = document.getElementById('waiterCallOverlay');
      const title = document.getElementById('waiterCallTitle');
      const time = document.getElementById('waiterCallTime');
      if (!overlay || !title || !time) return;

      title.textContent = `Masa ${tableNo} garson çağırdı`;
      time.textContent = `Saat: ${new Date(ts).toLocaleTimeString('tr-TR')}`;
      activeWaiterCall = { tableNo: Number(tableNo), ts: Number(ts) };
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function hideWaiterCallOverlay() {
      const overlay = document.getElementById('waiterCallOverlay');
      if (!overlay) return;
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      activeWaiterCall = null;
    }

    async function acknowledgeWaiterCall() {
      if (activeWaiterCall && Number.isFinite(activeWaiterCall.tableNo)) {
        try {
          await clearWaiterCallApi(activeWaiterCall.tableNo, activeWaiterCall.ts);
        } catch (e) { /* ignore */ }
      }
      hideWaiterCallOverlay();
    }

    function startWaiterPage() {
      if (waiterPageStarted) return;
      waiterPageStarted = true;

      document.addEventListener('visibilitychange', () => { if (!document.hidden) renderWaiter(); });
      setInterval(renderWaiter, 30_000);

      joinRoom('waiter');
      const socket = getSocket();

      socket.on('order:statusUpdate', (order) => {
        if (order?.status === 'hazir') renderWaiter();
      });
      socket.on('order:delivered', () => renderWaiter());

      socket.on('waiter:call', (data) => {
        const { tableNo, ts } = data || {};
        if (Number.isFinite(Number(tableNo)) && Number.isFinite(Number(ts))) {
          showWaiterCallOverlay(tableNo, ts);
        }
      });

      socket.on('waiter:callCleared', (data) => {
        const { tableNo } = data || {};
        if (activeWaiterCall && Number(activeWaiterCall.tableNo) === Number(tableNo)) {
          hideWaiterCallOverlay();
        }
      });

      renderWaiter();
    }

    async function submitWaiterPassword() {
      const nameInput = document.getElementById('waiterNameInput');
      const input = document.getElementById('waiterPasswordInput');
      const error = document.getElementById('waiterAuthError');
      const waiterName = String(nameInput?.value || '').trim();
      const pin = String(input?.value || '');

      if (!waiterName || !pin) {
        if (error) error.textContent = 'Garson adı ve PIN girin.';
        return;
      }

      try {
        await loginUser(waiterName, pin, 'waiter');
        const overlay = document.getElementById('waiterAuthOverlay');
        if (overlay) overlay.classList.add('hidden');
        syncWaiterIdentityUi();
        startWaiterPage();
      } catch (e) {
        if (error) error.textContent = e.message || 'Garson adı veya PIN hatalı.';
        if (input) input.focus();
      }
    }

    const existingUser = getLoggedInUser();
    if (existingUser && existingUser.role === 'waiter') {
      const overlay = document.getElementById('waiterAuthOverlay');
      if (overlay) overlay.classList.add('hidden');
      syncWaiterIdentityUi();
      startWaiterPage();
    } else {
      const nameInput = document.getElementById('waiterNameInput');
      const input = document.getElementById('waiterPasswordInput');
      if (nameInput) nameInput.focus();
      if (input) {
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') submitWaiterPassword();
        });
      }
    }
  </script>
</body>
</html>
