<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Q-Link Müşteri</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white rounded-2xl shadow-md p-8 max-w-md text-center">
    <h1 class="text-2xl font-bold text-green-700 mb-3">Q-Link</h1>

    <p class="text-sm text-gray-400 mt-4">URL formatı: <code class="bg-gray-100 px-2 py-1 rounded">/masa/5</code></p>
  </div>
</body>
</html>
